name: studio

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DO_NOT_TRACK: '1'
      SCARF_NO_ANALYTICS: 'true'
      # Ephemeral CI fixture credentials; this service contains no production data.
      STUDIO_TEST_POSTGRES_URL: postgresql://studio:studio-ci-fixture@127.0.0.1:5432/studio?sslmode=disable
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio-ci-fixture
          POSTGRES_DB: studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio -d studio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache the immutable local CPU model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/studio-local-model
          key: studio-cpu-${{ runner.os }}-${{ hashFiles('packages/studio/server/local/model-manifest.json') }}
      - name: Verify or download the SHA-pinned local model
        run: node packages/studio/scripts/download-local-model.mjs "$RUNNER_TEMP/studio-local-model"
      - name: Cache the immutable native T3 and OpenCode executables
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/studio-native-tools
          key: studio-native-${{ runner.os }}-${{ hashFiles('packages/studio/server/local/native-t3-tools.json') }}
      - name: Verify or install the SHA-pinned native T3 tools
        run: node packages/studio/scripts/install-native-t3-tools.mjs "$RUNNER_TEMP/studio-native-tools"
      - name: Build existing engine packages and Studio
        run: pnpm build
      - name: Studio typecheck
        run: pnpm --filter @ai-bdd/studio typecheck
      - name: Install the pinned Chromium used by runner and browser tests
        run: pnpm --filter @ai-bdd/studio exec playwright install --with-deps chromium
      - name: Prepare SHA-pinned official Chrome for real H.264 MP4 acceptance
        run: node packages/studio/verification/prepare-mp4-browser.mjs
      - name: Install the video encoder used by real render tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Require the real PostgreSQL fixture before any database acceptance tests
        working-directory: packages/studio
        run: |
          node --input-type=module <<'JS'
          import { Pool } from 'pg';
          if (!process.env.STUDIO_TEST_POSTGRES_URL) throw new Error('PostgreSQL acceptance cannot be skipped in CI');
          const pool = new Pool({ connectionString: process.env.STUDIO_TEST_POSTGRES_URL });
          try {
            const result = await pool.query('SHOW server_version_num');
            if (Number(result.rows[0].server_version_num) < 170000) throw new Error('PostgreSQL 17+ fixture is required');
          } finally { await pool.end(); }
          JS
      - name: API, mandatory PostgreSQL multi-instance/recovery, collaboration, Pact, MCP, and verifier tests
        env:
          STUDIO_LOCAL_TEST_MODEL_DIR: ${{ runner.temp }}/studio-local-model
          STUDIO_REQUIRE_LOCAL_MODEL_TEST: '1'
          STUDIO_TEST_T3_BINARY: ${{ runner.temp }}/studio-native-tools/t3/t3
          STUDIO_TEST_OPENCODE_BINARY: ${{ runner.temp }}/studio-native-tools/opencode/bin/opencode
          STUDIO_LOCAL_ADAPTER_MODULE: ${{ github.workspace }}/packages/studio/server/local/model.ts
        run: pnpm --filter @ai-bdd/studio test
      - name: Exact shell allocation and role policy verification
        run: pnpm --filter @ai-bdd/studio verify
      - name: Browser acceptance
        run: pnpm --filter @ai-bdd/studio test:e2e
      - name: Real local CPU picker, persisted chat and decision receipt browser acceptance
        env:
          STUDIO_LOCAL_TEST_MODEL_DIR: ${{ runner.temp }}/studio-local-model
          STUDIO_REQUIRE_LOCAL_MODEL_TEST: '1'
        run: pnpm --filter @ai-bdd/studio exec playwright test --config playwright.local-cpu.config.ts
      - name: Preserve failed traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-browser-evidence
          path: |
            packages/studio/test-results
            packages/studio/playwright-report
            work/review
          if-no-files-found: ignore
          retention-days: 14

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the non-root release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.studio
          push: false
          load: true
          tags: ai-bdd-studio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Production startup, durable context, browser driver, and demo refusal
        run: |
          mkdir -p work/review
          STUDIO_SMOKE_IMAGE=ai-bdd-studio:ci STUDIO_SMOKE_REPORT=work/review/container-smoke.json node packages/studio/verification/container-smoke.mjs
      - name: Preserve container smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-container-evidence
          path: work/review/container-smoke.json*
          if-no-files-found: ignore
          retention-days: 14
