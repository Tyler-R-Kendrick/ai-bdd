name: Feature request
description: Suggest a change to ai-bdd.
title: "Feature: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        The issue title is a short name for the request (the `Feature: ` prefix is already filled in). Describe the problem before the design.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today, and who hits it?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you would like ai-bdd to do. Note the package or command if you know it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered, including doing this outside ai-bdd.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Optional. Links, sample docs, constraints, or related issues.
    validations:
      required: false
