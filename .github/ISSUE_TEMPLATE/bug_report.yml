name: Bug report
description: Report a defect in ai-bdd.
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        The issue title is the bug title. Keep it to a short statement of what is wrong (the `Bug: ` prefix is already filled in).

        Security vulnerabilities belong in GitHub private reporting, not in a public issue. See https://github.com/Tyler-R-Kendrick/ai-bdd/blob/main/SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What broke, and which package, command, or document is involved?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Smallest sequence that shows the bug. Include commands and config that matter.
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead. Quote error text if there is any.
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node version
      description: Output of `node --version`.
      placeholder: v22.18.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: Operating system and version.
      placeholder: Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Optional. Paste command output, a stack trace, or a CI log. Remove secrets, tokens, and passwords first.
      render: shell
    validations:
      required: false
