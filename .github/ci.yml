# ai-bdd CI workflow.
#
# This file intentionally lives at .github/ci.yml instead of
# .github/workflows/ci.yml because the automated commit that produced it ran with
# a token that is not allowed to create workflow files. A maintainer should move it
# back:
#
#   git mv .github/ci.yml .github/workflows/ci.yml
#
# The content is a normal GitHub Actions workflow and is valid as-is.

name: ci

on:
  push:
    branches: [main, 'cline/**']
  pull_request:

env:
  CI: 'true'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: contract drift
        if: matrix.node == '24.x'
        run: node scripts/check-schema-drift.mjs

  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-requirements.mjs
      - run: node scripts/check-e2e-imports.mjs
      - run: node scripts/check-licenses.mjs
      - run: node scripts/check-docs.mjs

  plugins:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: js, dir: plugins/js/cucumber }
          - { language: python, dir: plugins/python/behave }
          - { language: python, dir: plugins/python/pytest }
          - { language: jvm, dir: plugins/jvm }
          - { language: dotnet, dir: plugins/dotnet }
          - { language: go, dir: plugins/go }
    steps:
      - uses: actions/checkout@v4
      - name: skip when the plugin is absent
        id: guard
        run: |
          if [ -d "${{ matrix.dir }}" ]; then echo "present=1" >> "$GITHUB_OUTPUT"; else echo "present=" >> "$GITHUB_OUTPUT"; fi
      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.present == '1'
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.present == '1'
        with:
          node-version: 24.x
          cache: pnpm
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.present == '1' && matrix.language == 'python'
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        if: steps.guard.outputs.present == '1' && matrix.language == 'jvm'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        if: steps.guard.outputs.present == '1' && matrix.language == 'dotnet'
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-go@v5
        if: steps.guard.outputs.present == '1' && matrix.language == 'go'
        with:
          go-version: '1.22'
      - name: plugin conformance
        if: steps.guard.outputs.present == '1'
        working-directory: ${{ matrix.dir }}
        run: |
          if [ -f package.json ]; then pnpm install --frozen-lockfile && pnpm test; fi
          if [ -f pyproject.toml ]; then python -m pip install -e . && python -m pytest; fi
          if [ -f pom.xml ]; then mvn -B test; fi
          if [ -f '*.csproj' ] || ls *.csproj >/dev/null 2>&1; then dotnet test; fi
          if [ -f go.mod ]; then go test ./...; fi
